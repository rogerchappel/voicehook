name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - releasebox.config.json
      - package.json
      - package-lock.json
      - .github/workflows/release*.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install ReleaseBox
        run: |
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm ci --prefix /tmp/releasebox
          npm run build --prefix /tmp/releasebox
      - run: npm ci
      - run: node /tmp/releasebox/bin/releasebox.js check .
      - run: npm run release:check
      - name: Release notes preview
        run: |
          if npm run release:notes --if-present -- . > release-notes-preview.md && [ -s release-notes-preview.md ]; then
            cat release-notes-preview.md
          else
            echo "## Release candidate" > release-notes-preview.md
            git log --oneline --max-count=20 >> release-notes-preview.md
            cat release-notes-preview.md
          fi
      - name: Publish release notes summary
        run: cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
